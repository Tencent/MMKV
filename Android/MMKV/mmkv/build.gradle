plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
//    id 'org.jetbrains.dokka' version '1.4.32' // For Kotlin projects
}
apply from: rootProject.file('gradle/build_library.gradle')

android {
    namespace "com.tencent.mmkv"
    compileSdk = 36
    publishing {
        multipleVariants("DefaultCppRelease") {
            includeBuildTypeValues('release')
            includeFlavorDimensionAndValues('stl_mode', 'DefaultCpp')
            withJavadocJar()
        }
        multipleVariants("StaticCppRelease") {
            includeBuildTypeValues('release')
            includeFlavorDimensionAndValues('stl_mode', 'StaticCpp')
            withJavadocJar()
        }
        multipleVariants("SharedCppRelease") {
            includeBuildTypeValues('release')
            includeFlavorDimensionAndValues('stl_mode', 'SharedCpp')
            withJavadocJar()
        }
    }

    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
        ndkVersion "28.1.13356709"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
    }
    buildTypes {
        release {
            minifyEnabled false
            externalNativeBuild {
                cmake {
                    cppFlags "-fvisibility=hidden", "-funwind-tables", "-fasynchronous-unwind-tables", "-O2"
                }
            }
            consumerProguardFiles 'proguard-rules.pro'
//            debuggable true
//            jniDebuggable true
        }
        debug {
            jniDebuggable true
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.18.0+"
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
    flavorDimensions = ["stl_mode"]
    productFlavors {
        DefaultCpp {
            dimension "stl_mode"
            ext.artifactIdSuffix = ''
            externalNativeBuild {
                cmake {
                    arguments = ["-DANDROID_STL=c++_static"]
                    cppFlags "-DMMKV_STL_SHARED=0"
                }
            }
        }
        StaticCpp {
            dimension "stl_mode"
            ext.artifactIdSuffix = 'static'
            externalNativeBuild {
                cmake {
                    arguments = ["-DANDROID_STL=c++_static"]
                    cppFlags "-DMMKV_STL_SHARED=0"
                }
            }
            // not working
//            packagingOptions {
//                exclude "prefab/modules/**"
//            }
        }
        SharedCpp {
            dimension "stl_mode"
            ext.artifactIdSuffix = 'shared'
            externalNativeBuild {
                cmake {
                    arguments = ["-DANDROID_STL=c++_shared"]
                    cppFlags "-DMMKV_STL_SHARED=1"
                }
            }
        }
    }
    buildFeatures {
        buildConfig true
        prefab true
        prefabPublishing true
        aidl true
    }
    prefab {
        mmkv {
            headers "../../../Core/include"
        }
    }
}

def releaseVariantNames = []

androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        def abiFilters = ['arm64-v8a', 'x86_64']
        def capName = variant.name.capitalize()
        releaseVariantNames += variant.name

        def strippedLibsDir = layout.buildDirectory.dir("intermediates/stripped_native_libs/${variant.name}/strip${capName}DebugSymbols/out/lib")
        // Create per-variant copy task
        tasks.register("syncStrippedLibsToPrefab${capName}", Copy) {
            from(strippedLibsDir) {
                include "**/libmmkv.so"
            }
            into layout.buildDirectory.dir("intermediates/prefab_package/${capName}/prefab/modules/mmkv/libs")
            eachFile {
//                    println('hhh before:' + path)
                for (abi in abiFilters) {
                    if (path.contains("${abi}/")) {
                        path = path.replace("${abi}/", "android.${abi}/")
                        break
                    }
                }
//                    println('hhh after:' + path)
            }

            // Hook into build process
            dependsOn("strip${capName}DebugSymbols")
        }

        // Hook into build process
        tasks.matching { it.name == "externalNativeBuild${capName}" }.configureEach {
            finalizedBy("syncStrippedLibsToPrefab${capName}")
        }
        tasks.matching { it.name == "bundle${capName}Aar" }.configureEach {
            dependsOn("syncStrippedLibsToPrefab${capName}")
        }
        tasks.matching { it.name == "bundle${capName}LocalLintAar" }.configureEach {
            dependsOn("syncStrippedLibsToPrefab${capName}")
        }

        def artifactIdSuffix = ""
        if (variant.name.toLowerCase().startsWith("staticcpp")) {
            artifactIdSuffix = "static"
        } else if (variant.name.toLowerCase().startsWith("sharedcpp")) {
            artifactIdSuffix = "shared"
        }
        def fullArtifactId = "${POM_ARTIFACT_ID}${artifactIdSuffix ? "-$artifactIdSuffix" : ""}"

        def mergeTaskName = "merge${capName}NativeLibs"
        def symbolsTask = tasks.register("bundleSymbols${capName}", Jar) {
            from(tasks.named(mergeTaskName).map { it.outputs.files })
            include '**/*.so'

            archiveClassifier.set("so-symbols")
            destinationDirectory.set(layout.buildDirectory.dir("intermediates/so-symbols/${variant.name}"))
            dependsOn mergeTaskName
        }

        afterEvaluate {
            publishing.publications.create(variant.name, MavenPublication) {
                from project.components.findByName(variant.name)

                groupId = group
                artifactId = fullArtifactId
                version = version

                artifact symbolsTask

                pom {
                    name = 'MMKV'
                    description = POM_DESCRIPTION
                    url = POM_URL
                    licenses {
                        license {
                            name = POM_LICENCE_NAME
                            url = POM_LICENCE_URL
                        }
                    }

                    developers {
                        developer {
                            id = POM_DEVELOPER_ID
                            name = POM_DEVELOPER_NAME
                        }
                    }

                    scm {
                        url = POM_SCM_URL
                        connection = POM_SCM_CONNECTION
                        developerConnection = POM_SCM_DEV_CONNECTION
                    }
                }
            }
        }
    }
}

// Configure repositories and signing
afterEvaluate {
    publishing.repositories {
        maven {
            name = "MavenCentral"
            url = RELEASE_REPOSITORY_URL
            credentials {
                username = REPOSITORY_USERNAME
                password = REPOSITORY_PASSWORD
            }
        }
    }

    signing {
        sign publishing.publications.matching {
            it.name in releaseVariantNames
        }
    }
}

configurations {
    javadocDeps
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.annotation:annotation:1.9.1'
    javadocDeps 'androidx.annotation:annotation:1.9.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    compileOnly project(':mmkvannotation')
}
